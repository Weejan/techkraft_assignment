services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techkraft_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/recruitment.db
      - SECRET_KEY=dev-secret-key-change-in-production-12345
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techkraft_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
